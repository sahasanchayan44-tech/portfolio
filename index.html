<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanchayan Saha | Writer, Reader, Analyst</title>
    <meta
      name="description"
      content="A premium portfolio for Sanchayan Saha: writer first, obsessive reader, science-trained thinker, and coding-literate analyst."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>
      <div class="grid-overlay"></div>
      <div class="noise-overlay"></div>

      <header class="topbar glass">
        <a class="brand" href="#hero">Sanchayan Saha</a>
        <nav class="nav">
          <a href="#about">About</a>
          <a href="#proof">Proof</a>
          <a href="#services">Services</a>
          <a href="#works">Works</a>
          <a href="#influences">Influences</a>
          <a href="#cultural-archive-section">Cultural Archive</a>
          <a href="#world-3d-section">3D World</a>
          <a href="#contact">Contact</a>
        </nav>
      </header>

      <main id="app"></main>
    </div>

    <template id="portfolio-template">
      <section class="hero section reveal" id="hero">
        <div class="hero-copy glass premium-panel">
          <p class="eyebrow" data-field="heroEyebrow"></p>
          <p class="hero-lead" data-field="heroLead"></p>
          <h1 data-field="name"></h1>
          <p class="hero-title" data-field="title"></p>
          <p class="hero-summary" data-field="heroSummary"></p>
          <div class="positioning-lines" data-list="positioningLines"></div>
          <div class="hero-actions">
            <a class="button button-primary" data-field="emailLink" href=""></a>
            <a class="button button-secondary" href="#works" data-field="secondaryCta"></a>
          </div>
          <div class="hero-metrics" data-list="heroStats"></div>
        </div>

        <aside class="hero-side">
          <div class="hero-portrait glass premium-panel">
            <div class="panel-topline">
              <span>Photo Placeholder</span>
              <span data-field="photoLabel"></span>
            </div>
            <div class="portrait-frame">
              <img data-field="photo" alt="Portrait placeholder for Sanchayan Saha" />
            </div>
            <p class="portrait-note" data-field="photoNote"></p>
            <div class="hero-badge-row" data-list="heroBadges"></div>
          </div>
          <div class="hero-quote glass premium-panel">
            <p class="quote-label">Positioning</p>
            <p class="quote-copy" data-field="positioningQuote"></p>
          </div>
        </aside>
      </section>

      <section class="section reveal" id="proof">
        <div class="proof-strip glass">
          <div class="proof-heading">
            <p class="eyebrow">Selected strengths</p>
            <h2 data-field="proofTitle"></h2>
          </div>
          <div class="proof-grid" data-list="proofItems"></div>
        </div>
      </section>

      <section class="section reveal" id="about">
        <div class="section-heading">
          <p class="eyebrow">About</p>
          <h2 data-field="aboutHeading"></h2>
          <p class="section-intro" data-field="aboutIntro"></p>
        </div>
        <div class="about-grid">
          <article class="glass prose-card premium-panel" data-field="aboutBody"></article>
          <aside class="about-side">
            <div class="glass detail-card premium-panel">
              <p class="detail-label">Profile</p>
              <div class="detail-list" data-list="profileHighlights"></div>
            </div>
            <div class="glass quote-stack premium-panel" data-list="quoteLines"></div>
          </aside>
        </div>
      </section>

      <section class="section reveal" id="services">
        <div class="section-heading">
          <p class="eyebrow">What I can write</p>
          <h2 data-field="servicesHeading"></h2>
          <p class="section-intro" data-field="servicesIntro"></p>
        </div>
        <div class="services-grid" data-list="serviceCategories"></div>
      </section>

      <section class="section reveal" id="works">
        <div class="section-heading">
          <p class="eyebrow">Selected works</p>
          <h2 data-field="worksHeading"></h2>
          <p class="section-intro" data-field="worksIntro"></p>
        </div>
        <div class="works-grid" data-list="works"></div>
      </section>

      <section class="section reveal" id="influences">
        <div class="section-heading">
          <p class="eyebrow">Influences</p>
          <h2 data-field="influencesHeading"></h2>
          <p class="section-intro" data-field="influencesIntro"></p>
        </div>
        <div class="influence-groups" data-list="influenceGroups"></div>
        <div class="glass quote-panel premium-panel">
          <p class="quote-label">Reading life</p>
          <p class="quote-copy" data-field="booksStatement"></p>
        </div>
      </section>

      <section class="section reveal" id="cultural-archive-preview">
        <div class="archive-teaser-card glass premium-panel">
          <div class="teaser-header">
            <p class="eyebrow" data-field="teaserEyebrow">Master Module — Cultural Identity</p>
            <h2 data-field="teaserHeading">The Cultural Archive</h2>
            <p class="section-intro" data-field="teaserIntro"></p>
          </div>
          <div class="teaser-metrics" data-list="teaserStats"></div>
          <div class="teaser-disclaimer">
            <span class="badge subtle-badge">Self-Reported Historical Estimate</span>
            <p>Approximate figures reflecting sustained immersion, character interpretation, and narrative architecture over speed or mechanical counts.</p>
          </div>
          <div class="teaser-actions">
            <a class="button button-primary" href="#cultural-archive-section">Explore Cultural Archive (2D)</a>
            <a class="button button-secondary" href="#world-3d-section">Enter 3D World (Location 8)</a>
          </div>
        </div>
      </section>

      <section class="section reveal" id="cultural-archive-section">
        <div id="cultural-archive-root"></div>
      </section>

      <section class="section reveal" id="world-3d-section">
        <div class="section-heading">
          <p class="eyebrow">Interactive Spatial Environment</p>
          <h2>The 3D World: Eight Architectural Locations</h2>
          <p class="section-intro">
            Explore my intellectual ecosystem in three dimensions. Location 8 houses <strong>The Cultural Archive</strong>, split into the interconnected sanctuaries of <strong>The Monumental Library</strong> and <strong>The Atmospheric Cinema</strong>.
          </p>
        </div>
        <div id="world-3d-root"></div>
      </section>

      <section class="section reveal" id="contact">
        <div class="contact-panel glass premium-panel">
          <div>
            <p class="eyebrow">Contact</p>
            <h2 data-field="contactHeading"></h2>
            <p class="contact-copy" data-field="contactBlurb"></p>
          </div>
          <div class="contact-actions">
            <a class="button button-primary" data-field="emailLinkSecondary" href=""></a>
            <p class="contact-meta" data-field="contactMeta"></p>
          </div>
        </div>
      </section>
    </template>

    <script src="script.js" type="module"></script>
  </body>
</html>
